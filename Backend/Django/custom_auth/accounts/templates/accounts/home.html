{% extends 'accounts/base.html' %}

{% block title %}Home - Custom Auth{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-8 text-center">
        <h1 class="display-4 fw-bold">Welcome to Custom Auth System</h1>
        <p class="lead text-muted mt-3">A secure and feature-rich user authentication and profile management system.</p>
        
        <div class="mt-5">
            <a href="{% url 'login' %}" class="btn btn-success btn-lg px-5 me-3">Login</a>
            <a href="{% url 'register' %}" class="btn btn-primary btn-lg px-5">Sign Up</a>
        </div>
    </div>
</div>
{% endblock %}
