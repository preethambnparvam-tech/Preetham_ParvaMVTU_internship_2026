{% extends 'base/base.html' %}
{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Confirm Action{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-danger">
      <div class="card-header bg-danger text-white"><i class="bi bi-exclamation-triangle-fill me-2"></i>Confirm Deactivation</div>
      <div class="card-body text-center py-4">
        <p class="mb-1">Deactivate faculty member:</p>
        <h5 class="fw-bold">{{ object }}</h5>
        <div class="d-flex justify-content-center gap-3 mt-3">
          <form method="post">{% csrf_token %}<button type="submit" class="btn btn-danger">Yes, Deactivate</button></form>
          <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
