<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Smart College ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1a3c5e 0%, #0f2840 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }
    .brand-logo {
      width: 60px; height: 60px;
      background: #1a3c5e;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; color: white;
      margin: 0 auto 1rem;
    }
    .form-control:focus { border-color: #1a3c5e; box-shadow: 0 0 0 .2rem rgba(26,60,94,.2); }
    .btn-login { background: #1a3c5e; border: none; padding: .75rem; font-weight: 600; }
    .btn-login:hover { background: #0f2840; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand-logo"><i class="bi bi-mortarboard-fill"></i></div>
    <h4 class="text-center fw-bold mb-1">Smart College ERP</h4>
    <p class="text-center text-muted small mb-4">ParvaM Consul-tech Pvt. Ltd.</p>

    {% if form.errors %}
      <div class="alert alert-danger alert-sm py-2">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>
        Invalid username or password.
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold small">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold small">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-login btn-primary w-100">Sign In</button>
    </form>

    <div class="mt-3 p-3 bg-light rounded small">
      <strong>Default logins:</strong><br>
      Admin: <code>admin / admin123</code><br>
      Faculty: employee ID as username & password<br>
      Student: roll number as username & password
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
