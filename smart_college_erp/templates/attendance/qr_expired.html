{% extends 'base/base.html' %}
{% block title %}QR Expired{% endblock %}
{% block page_title %}QR Attendance{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 text-center">
    <div class="card border-danger">
      <div class="card-body py-5">
        <div class="fs-1 text-danger mb-3"><i class="bi bi-x-circle-fill"></i></div>
        <h4 class="fw-bold text-danger">QR Code Expired</h4>
        <p class="text-muted">This QR code is no longer valid. Please ask your faculty to generate a new session.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-primary mt-2">Back to Dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
