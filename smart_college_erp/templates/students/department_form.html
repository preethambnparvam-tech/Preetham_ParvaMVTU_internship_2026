{% extends 'base/base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-header py-3">{{ title }}</div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3"><label class="form-label small fw-semibold">Department Name</label>{{ form.name }}</div>
          <div class="mb-3"><label class="form-label small fw-semibold">Code</label>{{ form.code }}</div>
          <div class="mb-3"><label class="form-label small fw-semibold">Head of Department</label>{{ form.hod }}</div>
          {% if form.errors %}<div class="alert alert-danger">{{ form.errors }}</div>{% endif %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'students:department_list' %}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
